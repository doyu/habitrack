[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "habitrack"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Hiroshi Doyu", email = "hiroshi.doyu@ninjalabo.ai"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["pandas"]

[project.urls]
Repository = "https://github.com/doyu/habitrack"
Documentation = "https://doyu.github.io/habitrack/"

[project.entry-points.nbdev]
habitrack = "habitrack._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "habitrack.__version__"}

[tool.setuptools.packages.find]
include = ["habitrack"]

[tool.nbdev]
